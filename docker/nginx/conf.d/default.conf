# ==============================================================================
# Nginx Reverse Proxy VirtualHost (Sistem ERP CI4 & phpMyAdmin)
# ==============================================================================

upstream erp_app {
    server app:80;
    keepalive 32;
}

upstream erp_pma {
    server phpmyadmin:80;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Batas ukuran upload file
    client_max_body_size 64M;

    # Header Keamanan
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Deteksi skema HTTPS (dari Cloudflare Edge maupun local reverse proxy)
    set $forwarded_proto $scheme;
    if ($http_x_forwarded_proto != "") {
        set $forwarded_proto $http_x_forwarded_proto;
    }

    # --------------------------------------------------------------------------
    # 1. Routing ke phpMyAdmin (/phpmyadmin/)
    # --------------------------------------------------------------------------
    location ^~ /phpmyadmin/ {
        proxy_pass http://erp_pma/;
        proxy_http_version 1.1;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_redirect default;

        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # --------------------------------------------------------------------------
    # 2. Routing Utama ke Aplikasi CodeIgniter 4 ERP
    # --------------------------------------------------------------------------
    location / {
        proxy_pass http://erp_app;
        proxy_http_version 1.1;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_redirect http://localhost/ http://$http_host/;
        proxy_redirect default;

        # Mendukung upgrade koneksi (WebSocket / Server-Sent Events jika ada)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;

        # Timeout & Buffer yang optimal untuk form input, export file, & audit log
        proxy_connect_timeout 180s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }
}
